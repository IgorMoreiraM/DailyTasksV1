# =========================================================
# CONFIGURA\u00C7\u00C3O DO SERVIDOR WEB
# =========================================================
server.port=8080

# =========================================================
# CONFIGURA\u00C7\u00C3O DO BANCO DE DADOS (PostgreSQL)
# =========================================================
# Aponta para o banco 'dailytasks' no Docker (Porta 5433 conforme seu setup)
spring.datasource.url=jdbc:postgresql://localhost:5433/dailytasks
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# CONFIGURA\u00C7\u00C3O DO JPA (Hibernate)
# =========================================================
# 'update': O Hibernate atualiza as tabelas automaticamente (essencial para o novo campo de senha)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Debug: Mostra o SQL gerado no console (\u00FAtil para ver se a coluna senha_temporaria foi criada)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# CONFIGURA\u00C7\u00C3O DE SEGURAN\u00C7A (JWT)
# =========================================================
# Chave secreta usada pelo TokenService para assinar e validar o JWT
api.security.token.secret=${JWT_SECRET:minha-chave-secreta-super-dificil-12345}

# =========================================================
# LOGGING (Opcional, mas ajuda muito no desenvolvimento)
# =========================================================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG